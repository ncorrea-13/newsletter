x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Única salida del bot hacia internet. Vive en las redes "agent" (interna)
  # para recibir al bot, y "egress" para salir a internet.
  egress-proxy:
    <<: *hardened
    build: docker/squid
    image: newsletter-egress-proxy:local
    restart: unless-stopped
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    tmpfs:
      - /run
      - /var/log/squid
      - /var/spool/squid
      - /tmp
    networks:
      agent:
        ipv4_address: 172.28.10.10
      egress: {}

  newsletter-bot:
    <<: *hardened
    image: newsletter-bot:local
    build: .
    init: true
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      - egress-proxy
    environment:
      HTTP_PROXY: http://172.28.10.10:3128
      HTTPS_PROXY: http://172.28.10.10:3128
      http_proxy: http://172.28.10.10:3128
      https_proxy: http://172.28.10.10:3128
      NO_PROXY: localhost,127.0.0.1
    networks:
      - agent
    tmpfs:
      - /tmp
    volumes:
      - ./config:/config:ro
      - ./prompts:/prompts:ro
      - ./data:/data
      - ${NEWSLETTER_AUTH_DIR:-./auth}:/auth

  newsletter-feeds:
    <<: *hardened
    image: newsletter-bot:local
    command: ["serve"]
    profiles: ["feeds"]
    init: true
    pids_limit: 128
    restart: unless-stopped
    environment:
      FEED_DIR: /data/public
      FEED_LISTEN_ADDR: :8080
    ports:
      - "${FEED_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - ./data/public:/data/public:ro

networks:
  agent:
    internal: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
  egress: {}
